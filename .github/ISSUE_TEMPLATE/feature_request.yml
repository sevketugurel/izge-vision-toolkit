name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How would we know it works?
      description: Data, metric, or test. Claims about animal behaviour need a validation plan with human labels.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require committing farm footage, model weights, or credentials.
          required: true
