name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real farm footage, camera credentials, RTSP URLs, or personal data.
        Security problems: see SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands. A synthetic input is preferred.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python, Node, Docker/PostgreSQL versions, CPU/GPU.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact secrets and paths you do not want public)
      render: text
