[project]
name = "izge"
version = "0.1.0"
description = "Saha video kayıtları ve insan incelemesi"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.52.4", "pydantic==2.13.5",
  "sqlalchemy==2.0.44", "psycopg[binary]==3.2.12", "alembic==1.20.1",
  "av==19.0.0", "python-multipart==0.0.32",
  "numpy==2.5.4", "pyarrow==26.0.0", "pyyaml==6.0.3", "pillow==13.0.0", "scikit-learn==1.9.1", "scipy==1.18.1",
]
[project.optional-dependencies]
# Frozen DINOv3 backbone. Linux resolves the CPU-only PyTorch build; macOS wheels support MPS.
ml = ["torch==2.14.1", "transformers==5.19.0"]
# GPU worker image (linux/amd64): CUDA 12.6 PyTorch build; needs NVIDIA driver >= 560 on the host.
gpu = ["torch==2.14.1", "transformers==5.19.0"]
# Google Cloud Storage backend (IZGE_STORAGE=gcs).
gcp = ["google-cloud-storage==3.17.0"]
training = [
    "mlflow-skinny==3.17.2",
    "psutil==7.2.2",
]
[tool.uv]
conflicts = [[{ extra = "ml" }, { extra = "gpu" }]]
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "ml", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "gpu" },
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[dependency-groups]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.14.0"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
target-version = "py314"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/izge"]
