[project]
name = "izge"
version = "0.1.0"
description = "Saha video kayıtları ve insan incelemesi"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.52.4", "pydantic==2.13.5",
  "sqlalchemy==2.0.44", "psycopg[binary]==3.2.12", "alembic==1.17.0",
  "av==19.0.0", "python-multipart==0.0.32",
  "numpy==2.5.4", "pyarrow==26.0.0", "pyyaml==6.0.3", "pillow==12.3.0", "scikit-learn==1.9.1",
]
[project.optional-dependencies]
# Frozen DINOv3 backbone. Linux resolves the CPU-only PyTorch build; macOS wheels support MPS.
ml = ["torch==2.14.1", "transformers==5.19.0"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
target-version = "py314"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
