[project]
name = "izge-rfdetr-seg-experiment"
version = "0.1.0"
description = "Isolated, inference-only RF-DETR Seg Small reference experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rfdetr==1.11.2", "torch==2.14.1", "torchvision==0.29.1",
  "transformers==5.19.0", "numpy==2.5.4",
  "scipy==1.18.1",
  "av==19.0.0", "pillow==13.0.0",
  "pydantic==2.14.3", "pyyaml==6.0.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# The adapter calls ModelContext/LWDETR/PostProcess, not predict()'s Supervision wrapper.
# Both tested macOS OpenCV wheels bundle GPL FFmpeg; do not install that unused wrapper.
override-dependencies = ["supervision; sys_platform == 'win32'"]
